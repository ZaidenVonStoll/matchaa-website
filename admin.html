<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchaa Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #3D6B4F;
      --green-dark: #2D5C3E;
      --green-light: #E8F2EC;
      --red: #E07B6A;
      --red-light: #FDF0EE;
      --bg: #FAF8F4;
      --card: #fff;
      --border: #E4EDE7;
      --text: #1C2B22;
      --muted: #7A8C80;
      --label: #A8B8AC;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .login-logo-box {
      width: 40px;
      height: 40px;
      background: var(--green);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .login-logo span {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .login-title { font-size: 22px; font-weight: 800; color: var(--text); }
    .login-sub { font-size: 14px; color: var(--muted); }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 11px; font-weight: 700; color: var(--label); letter-spacing: 1px; }
    .input-group input {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .input-group input:focus { border-color: var(--green); }

    .btn-primary {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { font-size: 13px; color: var(--red); text-align: center; display: none; }

    /* ── MAIN APP ── */
    #app { display: none; }

    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-logo {
      width: 32px; height: 32px;
      background: var(--green);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .topbar-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .topbar-badge {
      background: var(--green-light);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .btn-logout {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
      width: fit-content;
    }

    .tab-btn {
      padding: 8px 20px;
      border-radius: 10px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--green); color: #fff; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }

    .stat-num { font-size: 32px; font-weight: 800; color: var(--green); }
    .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── VERIFICATION CARDS ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .section-count { font-size: 13px; color: var(--muted); font-weight: 600; }

    .verif-list { display: flex; flex-direction: column; gap: 16px; }

    .verif-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .verif-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .verif-avatar {
      width: 48px; height: 48px;
      border-radius: 24px;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .verif-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .verif-user-info { flex: 1; }
    .verif-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .verif-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .verif-time {
      font-size: 11px;
      color: var(--label);
      font-weight: 600;
    }

    .status-pill {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-pending { background: #FFF8E8; color: #856404; border: 1px solid #F5D87A; }
    .status-approved { background: var(--green-light); color: var(--green); border: 1px solid var(--border); }
    .status-rejected { background: var(--red-light); color: var(--red); border: 1px solid #F5C5BC; }

    .verif-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .verif-image-block { display: flex; flex-direction: column; gap: 8px; }
    .verif-image-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--label);
      letter-spacing: 1px;
    }

    .verif-image-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 3/2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .verif-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .verif-image-wrap.selfie { aspect-ratio: 1/1; }
    .verif-image-wrap.selfie img { object-fit: cover; }

    .img-expand {
      position: absolute;
      bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .verif-actions {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      align-items: center;
    }

    .btn-approve {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-approve:hover { opacity: 0.85; }
    .btn-approve:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-reject {
      background: var(--red-light);
      color: var(--red);
      border: 1.5px solid #F5C5BC;
      border-radius: 12px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reject:hover { background: var(--red); color: #fff; }
    .btn-reject:disabled { opacity: 0.4; cursor: not-allowed; }

    .action-result {
      font-size: 13px;
      font-weight: 600;
      margin-left: auto;
    }
    .action-result.success { color: var(--green); }
    .action-result.error { color: var(--red); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 64px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state-icon { font-size: 48px; }
    .empty-state-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .empty-state-sub { font-size: 14px; color: var(--muted); }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 64px;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 12px;
      object-fit: contain;
    }
    #lightbox-close {
      position: fixed;
      top: 20px; right: 24px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 700px) {
      .stats-row { grid-template-columns: 1fr; }
      .verif-images { grid-template-columns: 1fr; }
      .topbar { padding: 14px 16px; }
      .main { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-box">🍵</div>
      <span>matchaa admin</span>
    </div>
    <div>
      <div class="login-title">Sign in</div>
      <div class="login-sub">Verification review dashboard</div>
    </div>
    <div class="input-group">
      <label>EMAIL</label>
      <input type="email" id="login-email" placeholder="admin@matchaa.app" autocomplete="email" />
    </div>
    <div class="input-group">
      <label>PASSWORD</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="error-msg" id="login-error">Incorrect credentials. Try again.</div>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">Sign in</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🍵</div>
      <div class="topbar-title">Matchaa Admin</div>
      <div class="topbar-badge" id="pending-badge">0 pending</div>
    </div>
    <button class="btn-logout" onclick="handleLogout()">Sign out</button>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">—</div>
        <div class="stat-label">Pending review</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-approved">—</div>
        <div class="stat-label">Approved all time</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">Total submissions</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('pending', this)">Pending</button>
      <button class="tab-btn" onclick="switchTab('approved', this)">Approved</button>
      <button class="tab-btn" onclick="switchTab('rejected', this)">Rejected</button>
    </div>

    <!-- List -->
    <div id="verif-container">
      <div class="loading">Loading...</div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Document" onclick="event.stopPropagation()" />
</div>

<script>
  const SUPABASE_URL = 'https://ozwkjbcggqmvvkkfqnzk.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

  // ── ADMIN PASSWORD (change this to something strong) ──────────────────────
  // This is a simple client-side gate. The real security is Supabase RLS —
  // only service_role can update verification status.
  // For stronger auth, replace with Supabase auth.signInWithPassword().
  const ADMIN_EMAIL = 'matchaahq@gmail.com'; // change to your email
  const ADMIN_PASSWORD = 'MatchaaAdmin2026!'; // change this immediately

  let currentTab = 'pending';
  let supabaseHeaders = {};

  // ── AUTH ──────────────────────────────────────────────────────────────────

  async function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errorEl.style.display = 'none';

    try {
      // Sign in with Supabase Auth
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!data.access_token) {
        throw new Error('Invalid credentials');
      }

      // Extra check — only allow the admin email
      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        throw new Error('Not authorised');
      }

      supabaseHeaders = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${data.access_token}`,
        'Content-Type': 'application/json',
      };

      sessionStorage.setItem('admin_token', data.access_token);

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();

    } catch (err) {
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  function handleLogout() {
    sessionStorage.removeItem('admin_token');
    supabaseHeaders = {};
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }

  // Allow Enter key on login
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  // Auto-restore session
  window.addEventListener('load', () => {
    const token = sessionStorage.getItem('admin_token');
    if (token) {
      supabaseHeaders = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
      };
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();
    }
  });

  // ── DATA ──────────────────────────────────────────────────────────────────

  async function query(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: supabaseHeaders });
    return res.json();
  }

  async function patch(path, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: 'PATCH',
      headers: { ...supabaseHeaders, 'Prefer': 'return=minimal' },
      body: JSON.stringify(body),
    });
    return res.ok;
  }

  async function insert(path, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method: 'POST',
      headers: { ...supabaseHeaders, 'Prefer': 'return=minimal' },
      body: JSON.stringify(body),
    });
    return res.ok;
  }

  async function getSignedUrl(path) {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/sign/verification-docs/${path}`, {
      method: 'POST',
      headers: supabaseHeaders,
      body: JSON.stringify({ expiresIn: 3600 }),
    });
    const data = await res.json();
    return data.signedURL ? `${SUPABASE_URL}/storage/v1${data.signedURL}` : null;
  }

  async function loadData() {
    // Load stats
    const [pending, approved, total] = await Promise.all([
      query('verification_requests?status=eq.pending&select=id'),
      query('verification_requests?status=eq.approved&select=id'),
      query('verification_requests?select=id'),
    ]);

    const pendingCount = Array.isArray(pending) ? pending.length : 0;
    document.getElementById('stat-pending').textContent = pendingCount;
    document.getElementById('stat-approved').textContent = Array.isArray(approved) ? approved.length : 0;
    document.getElementById('stat-total').textContent = Array.isArray(total) ? total.length : 0;
    document.getElementById('pending-badge').textContent = `${pendingCount} pending`;

    renderTab(currentTab);
  }

  async function renderTab(tab) {
    const container = document.getElementById('verif-container');
    container.innerHTML = '<div class="loading">Loading...</div>';

    const requests = await query(
      `verification_requests?status=eq.${tab}&select=*,users!verification_requests_user_id_fkey(id,name,display_name,username,avatar_url,avatar_color,push_token)&order=created_at.desc`
    );

    if (!Array.isArray(requests) || requests.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">${tab === 'pending' ? '✅' : tab === 'approved' ? '🏅' : '🚫'}</div>
          <div class="empty-state-title">No ${tab} verifications</div>
          <div class="empty-state-sub">${tab === 'pending' ? 'All caught up — nothing to review right now.' : `No ${tab} submissions yet.`}</div>
        </div>`;
      return;
    }

    // Fetch signed URLs for all images
    const cards = await Promise.all(requests.map(async (req) => {
      const idUrl = req.storage_path ? await getSignedUrl(req.storage_path) : null;
      const selfieUrl = req.selfie_url ? await getSignedUrl(req.selfie_url) : null;
      return renderCard(req, idUrl, selfieUrl);
    }));

    container.innerHTML = `
      <div class="section-header">
        <div class="section-title">${tab.charAt(0).toUpperCase() + tab.slice(1)} verifications</div>
        <div class="section-count">${requests.length} submission${requests.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="verif-list">${cards.join('')}</div>`;
  }

  function renderCard(req, idUrl, selfieUrl) {
    const user = req.users || {};
    const name = user.display_name || user.name || 'Unknown';
    const initial = name[0]?.toUpperCase() || '?';
    const username = user.username ? `@${user.username}` : '';
    const submitted = req.created_at ? timeAgo(req.created_at) : '';
    const isPending = req.status === 'pending';

    const avatarHtml = user.avatar_url
      ? `<img src="${user.avatar_url}" alt="${name}" />`
      : initial;

    const idHtml = idUrl
      ? `<div class="verif-image-wrap" onclick="openLightbox('${idUrl}')">
          <img src="${idUrl}" alt="ID document" loading="lazy" />
          <div class="img-expand">Expand</div>
        </div>`
      : `<div class="verif-image-wrap" style="color:var(--muted);font-size:13px;">No image</div>`;

    const selfieHtml = selfieUrl
      ? `<div class="verif-image-wrap selfie" onclick="openLightbox('${selfieUrl}')">
          <img src="${selfieUrl}" alt="Selfie" loading="lazy" />
          <div class="img-expand">Expand</div>
        </div>`
      : `<div class="verif-image-wrap selfie" style="color:var(--muted);font-size:13px;">No image</div>`;

    const actionsHtml = isPending ? `
      <div class="verif-actions">
        <button class="btn-approve" onclick="decide('${req.user_id}', 'approved', this, '${name}', '${user.push_token || ''}')">
          ✓ Approve
        </button>
        <button class="btn-reject" onclick="decide('${req.user_id}', 'rejected', this, '${name}', '${user.push_token || ''}')">
          ✕ Reject
        </button>
        <span class="action-result" id="result-${req.user_id}"></span>
      </div>` : `
      <div class="verif-actions">
        <span class="status-pill status-${req.status}">${req.status === 'approved' ? '✓ Approved' : '✕ Rejected'}</span>
        ${req.reviewed_at ? `<span style="font-size:12px;color:var(--muted);">Reviewed ${timeAgo(req.reviewed_at)}</span>` : ''}
      </div>`;

    return `
      <div class="verif-card" id="card-${req.user_id}">
        <div class="verif-card-header">
          <div class="verif-avatar">${avatarHtml}</div>
          <div class="verif-user-info">
            <div class="verif-name">${name}</div>
            <div class="verif-meta">${username}${username && req.users?.id ? ' · ' : ''}${req.users?.id?.slice(0, 8) || ''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <span class="status-pill status-${req.status}">${req.status}</span>
            <span class="verif-time">${submitted}</span>
          </div>
        </div>
        <div class="verif-images">
          <div class="verif-image-block">
            <div class="verif-image-label">GOVERNMENT ID</div>
            ${idHtml}
          </div>
          <div class="verif-image-block">
            <div class="verif-image-label">SELFIE</div>
            ${selfieHtml}
          </div>
        </div>
        ${actionsHtml}
      </div>`;
  }

  // ── DECISIONS ─────────────────────────────────────────────────────────────

  async function decide(userId, status, btn, userName, pushToken) {
    const card = document.getElementById(`card-${userId}`);
    const allBtns = card.querySelectorAll('button');
    const resultEl = document.getElementById(`result-${userId}`);

    allBtns.forEach(b => b.disabled = true);
    btn.textContent = 'Saving...';

    try {
      // 1. Update verification_requests status
      const updated = await patch(
        `verification_requests?user_id=eq.${userId}`,
        { status, reviewed_at: new Date().toISOString() }
      );

      if (!updated) throw new Error('Update failed');

      // 2. Update users.is_verified
      await patch(`users?id=eq.${userId}`, { is_verified: status === 'approved' });

      // 3. Send in-app notification
      const notifBody = status === 'approved'
        ? `Your identity has been verified! Your ✓ Verified badge is now live on your profile.`
        : `Your verification was unsuccessful. Please resubmit with a clearer photo of your ID and selfie.`;

      await insert('notifications', {
        user_id: userId,
        type: 'verification_result',
        body: notifBody,
        data: { status },
        read: false,
      });

      // 4. Send push notification (if token exists)
      if (pushToken && pushToken !== 'undefined' && pushToken !== '') {
        await sendPushNotification(pushToken, status, userName);
      }

      resultEl.textContent = status === 'approved' ? '✓ Approved & notified' : '✕ Rejected & notified';
      resultEl.className = `action-result ${status === 'approved' ? 'success' : 'error'}`;

      // Refresh after 1.5s
      setTimeout(() => loadData(), 1500);

    } catch (err) {
      resultEl.textContent = 'Error — try again';
      resultEl.className = 'action-result error';
      allBtns.forEach(b => b.disabled = false);
      btn.textContent = status === 'approved' ? '✓ Approve' : '✕ Reject';
    }
  }

  async function sendPushNotification(token, status, userName) {
    // Uses Expo Push API — no server needed
    const title = status === 'approved' ? '✓ You\'re verified!' : 'Verification update';
    const body = status === 'approved'
      ? 'Your identity has been verified. Your badge is live!'
      : 'Your verification was unsuccessful. Tap to resubmit.';

    await fetch('https://exp.host/--/api/v2/push/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: token, title, body, sound: 'default' }),
    });
  }

  // ── TABS ──────────────────────────────────────────────────────────────────

  function switchTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderTab(tab);
  }

  // ── LIGHTBOX ──────────────────────────────────────────────────────────────

  function openLightbox(url) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  // ── HELPERS ───────────────────────────────────────────────────────────────

  function timeAgo(iso) {
    const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (secs < 60) return `${secs}s ago`;
    const mins = Math.floor(secs / 60);
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }
</script>
</body>
